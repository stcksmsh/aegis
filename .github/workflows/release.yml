name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          conf_version="$(jq -r .version apps/ui/src-tauri/tauri.conf.json)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$conf_version" != "$tag_version" ]; then
            echo "Tag v$tag_version does not match tauri.conf.json version $conf_version" >&2
            exit 1
          fi

      # A release without the updater key could never update itself: fail early.
      - name: Check updater signing is set up
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "Secret TAURI_SIGNING_PRIVATE_KEY is not set" >&2; exit 1; }
          pubkey="$(jq -r '.plugins.updater.pubkey // ""' apps/ui/src-tauri/tauri.conf.json)"
          [ -n "$pubkey" ] || { echo "plugins.updater.pubkey in tauri.conf.json is empty" >&2; exit 1; }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      - name: Fetch bundled restic
        shell: bash
        run: |
          bash scripts/fetch-restic.sh ${{ matrix.target }}
          bash scripts/fetch-restore-kit.sh

      # Signs the update bundles; tauri-action merges every platform into the
      # release's latest.json. Updater artifacts are enabled only here so CI
      # builds without the signing key keep working.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/ui
          tagName: ${{ github.ref_name }}
          releaseName: "Aegis v__VERSION__"
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          releaseBody: |
            ## Download

            Pick the file for your operating system:

            - **Windows**: `.msi` or the `-setup.exe` installer
            - **macOS (Apple Silicon, M1/M2/M3/M4)**: `aarch64.dmg`
            - **macOS (Intel)**: `x64.dmg`
            - **Linux**: `.AppImage` (run anywhere) or `.deb` (Debian/Ubuntu)

            restic is bundled — no separate install needed.

            ## First launch

            Aegis is free and not signed with a paid certificate, so the first launch
            shows a warning once. It's safe to continue:

            **macOS**: click **Done**, then open **System Settings → Privacy & Security**,
            scroll down and click **Open Anyway** next to Aegis.

            **Windows**: on "Windows protected your PC", click **More info**, then **Run anyway**.

            Step-by-step help: [User Guide](https://github.com/stcksmsh/aegis/blob/master/docs/USER_GUIDE.md#first-launch-warning)

  # Copy the release's latest.json to the update feeds the app polls:
  # track-X.Y (fixes for X.Y) and track-X (newer minors). Prereleases never do.
  # "[security]" in the release notes or the annotated tag message marks the
  # update as a security release (installs automatically across minors).
  feeds:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Publish update feeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          notes="$(gh release view "$TAG" --json body -q .body; git tag -l --format='%(contents)' "$TAG")"
          mkdir -p "$RUNNER_TEMP/feed"
          feed="$RUNNER_TEMP/feed/latest.json"
          gh release download "$TAG" -p latest.json -O "$feed"
          if grep -qF '[security]' <<<"$notes"; then
            jq '.security = true' "$feed" > "$feed.tmp" && mv "$feed.tmp" "$feed"
          fi
          cat "$feed"
          version="${TAG#v}"; major="${version%%.*}"; rest="${version#*.}"; minor="${rest%%.*}"
          for track in "track-$major.$minor" "track-$major"; do
            gh release view "$track" > /dev/null 2>&1 || gh release create "$track" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Update feed $track" \
              --notes "Used by Aegis to check for updates. Download Aegis from the latest release instead."
            gh release upload "$track" "$feed" --clobber
          done
